name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Validate skills and repo text
        run: node scripts/validate.mjs
        env:
          CI: true
          HYGIENE_TERMS: ${{ secrets.HYGIENE_TERMS }}

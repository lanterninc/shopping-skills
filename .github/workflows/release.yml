name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Tag matches the plugin version
        run: |
          version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin version ${version}" >&2
            exit 1
          fi
      - run: npm test
      - name: Validate skills and repo text
        run: node scripts/validate.mjs
        env:
          CI: true
          HYGIENE_TERMS: ${{ secrets.HYGIENE_TERMS }}
      - name: Zip each skill
        run: |
          mkdir -p dist
          cd skills
          for skill in */; do
            name="${skill%/}"
            zip -r "../dist/${name}.zip" "${name}"
          done
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

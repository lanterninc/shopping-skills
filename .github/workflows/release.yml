name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Validate skills and repo text
        run: node scripts/validate.mjs
        env:
          CI: true
          HYGIENE_TERMS: ${{ secrets.HYGIENE_TERMS }}
      - name: Zip each skill
        run: |
          mkdir -p dist
          cd skills
          for skill in */; do
            name="${skill%/}"
            zip -r "../dist/${name}.zip" "${name}"
          done
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
